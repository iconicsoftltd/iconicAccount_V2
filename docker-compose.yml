# ================================================================
#  Project: ERP / Accounting System
#  Stack  : React (Vite) + Express (TypeScript) + Prisma + MySQL
#  Mode   : Development (bind mounts + hot reload) behind Nginx + SSL
# ================================================================
#  Public entry: nginx on 80/443. Backend/frontend are internal only.
#  Set DOMAIN, VITE_API_URL, and DB_* in root .env (see .env.example).
# ================================================================

services:

  # ──────────────────────────────────────────────────────────────
  # MySQL 8 Database (no host port — internal network only)
  # ──────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────────
  # Backend — Node.js + Express + TypeScript + Prisma
  # ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: development
    container_name: erp_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}"
      NODE_ENV:     ${NODE_ENV:-development}
      PORT:         5000
      # Reason: comma-separated extra origins for browser + Docker dev (see backend .env.example)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    expose:
      - "5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    command: >
      sh -c "
        echo 'Running Prisma migrations...' &&
        npx prisma migrate deploy &&
        echo 'Starting server...' &&
        npm run dev
      "

  # ──────────────────────────────────────────────────────────────
  # Frontend — Vite + React + TypeScript
  # ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: erp_frontend
    restart: unless-stopped
    environment:
      # Reason: Vite only exposes env vars prefixed with VITE_
      VITE_API_URL: ${VITE_API_URL}
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - erp-network

  # ──────────────────────────────────────────────────────────────
  # Nginx — reverse proxy + TLS (see nginx/entrypoint.sh)
  # ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - erp-network
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]

  # ──────────────────────────────────────────────────────────────
  # Certbot — renewals (initial cert: see README / deploy.sh)
  # ──────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: erp_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - "while :; do certbot renew --webroot -w /var/www/certbot || true; sleep 43200; done"
    depends_on:
      - nginx
    networks:
      - erp-network

  # ──────────────────────────────────────────────────────────────
  # Prisma Studio — DB GUI (optional, dev only)
  # Run: docker compose --profile tools up prisma-studio
  # ──────────────────────────────────────────────────────────────
  prisma-studio:
    build:
      context: ./backend
      target: development
    container_name: erp_prisma_studio
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}"
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp-network
    command: npx prisma studio --port 5555 --browser none
    profiles:
      - tools

# ──────────────────────────────────────────────────────────────
# Volumes & Networks
# ──────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  erp-network:
    driver: bridge
